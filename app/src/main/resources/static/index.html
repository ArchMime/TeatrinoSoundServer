<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teatrino Control Panel</title>
    <!-- Vinculación del archivo CSS externo -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="barra-control">
    <!-- Gatillo obligatorio de interacción para Fullscreen + WakeLock -->
    <button id="btnModoFuncion" onclick="engranarModoFuncion()">🎭 ENTRAR EN MODO FUNCIÓN</button>

    <div class="contenedor-volumen">
        <span>🔊</span>
        <input type="range" class="slider-volumen" min="0" max="1" step="0.05" value="1"
               oninput="transmitirVolumen(this.value)">
    </div>

    <span id="txtEstado" class="estado-conexion">Buscando Servidor...</span>

    <button class="btn-stop" onclick="enviarComando('STOP', '0')">🛑 STOP GENERAL</button>
</div>

<!-- Contenedor dinámico e inmune a bloqueos -->
<div id="contenedorGrid" class="grid-botonera"></div>

<!-- Vinculación del archivo JavaScript externo -->
<script src="controlador.js"></script>
</body>
</html>
